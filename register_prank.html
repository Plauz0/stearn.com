<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация аккаунта</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #f8fafc;
    }

    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }

    h2 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    /* Модальное окно с розыгрышем */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1rem;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #1e293b;
      border: 2px solid #38bdf8;
      padding: 2rem;
      border-radius: 12px;
      max-width: 360px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .overlay.active .modal {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .modal h3 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }

    .modal p {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .btn-close {
      background: #334155;
      padding: 0.5rem 1.5rem;
      font-size: 0.9rem;
      width: auto;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Создать аккаунт</h2>
    <p class="subtitle">Введите данные для быстрой регистрации</p>

    <form id="regForm" onsubmit="event.preventDefault();">
      <div class="form-group">
        <label for="username">Имя пользователя или Email</label>
        <input type="text" id="username" placeholder="user@example.com" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="off">
      </div>

      <button type="submit">Зарегистрироваться</button>
    </form>
  </div>

  <div class="overlay" id="jokeModal">
    <div class="modal">
      <div class="modal-icon">🎉</div>
      <h3>Это розыгрыш!</h3>
      <p>Никакие данные не сохраняются и не отправляются на сервер. Форма создана исключительно ради шутки.</p>
      <button class="btn-close" id="closeBtn">Понятно</button>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById('password');
    const modal = document.getElementById('jokeModal');
    const closeBtn = document.getElementById('closeBtn');

    // Срабатывает сразу при вводе первого символа
    passwordInput.addEventListener('input', () => {
      passwordInput.value = ''; // Стираем введенное значение
      passwordInput.blur();     // Снимаем фокус с поля
      modal.classList.add('active');
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });
  </script>

</body>
</html>
